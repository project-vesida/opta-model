# ─────────────────────────────────────────────────────────────────────────────
# OpTA Parameter Sweep Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Hardware is resolved from the in-repo catalog (hardware_catalog.py):
#   • sensor_keys — sensor preset keys (imx585, imx290, …)
#   • lens_keys   — lens catalog keys (artisans_25_f095, …)
# The sweep script crosses every sensor_key with every lens_key automatically.
#
# Scene-sensitivity sweeps use reference_profile (default: sweep_reference)
# for neutral hardware; geometry lives in scene_reference.
# Budget constants come from optimizer.py (MAX_BOM_USD, etc.).
# ─────────────────────────────────────────────────────────────────────────────


# ── Hardware catalog keys ─────────────────────────────────────────────────────
sensor_keys:
  - imx585
  - imx678
  - imx662
  - imx477
  - imx296
  - imx174
  - imx290
  - imx462

lens_keys:
  - artisans_25_f095
  - rokinon_35_f14
  - viltrox_85_f14

reference_profile: sweep_reference


# ── Scene ─────────────────────────────────────────────────────────────────────
scene:
  cross_sections_m2:          [0.01, 0.05, 0.1, 0.5, 1.0, 5.0]
  albedo:                     0.1
  phase_coefficient:          0.08    # specular sphere (Luciole/AMOS 2024)
  sky_brightness_mag_arcsec2: 21.0    # rural dark sky


# ── Observation geometry ──────────────────────────────────────────────────────
geometry:
  slant_ranges_km:          [400, 600, 800, 1000, 1200, 1500, 2000]
  elevation_angles_deg:     [10, 15, 20, 30, 45, 60, 75, 90]
  angular_velocities_deg_s: [0.1, 0.2, 0.5, 0.75, 1.0, 1.5, 2.0]
  phase_angles_deg:         [0, 10, 20, 30, 45, 60, 75, 90, 105, 120, 135, 150, 170, 180]


# ── Sky conditions (twilight / lunar sweep) ───────────────────────────────────
sky_conditions:
  sun_elevations_deg: [-3, -6, -9, -12, -15, -18]
  lunar_phases:       [0.0, 0.25, 0.5, 0.75, 1.0]


# ── Detection criterion ───────────────────────────────────────────────────────
detection:
  snr_threshold: 3.0


# ── Pixel-size and frame-rate sensitivity axes ────────────────────────────────
# Used for parameter sensitivity sweeps (one axis varies; hardware reference
# comes from reference_profile).
sweep_axes:
  pixel_sizes_um: [2.4, 2.9, 3.45, 3.76, 4.8, 5.86]
  frame_rates_hz: [10, 15, 20, 25, 30]


# ── Scene reference (for one-axis sensitivity sweeps) ────────────────────────
scene_reference:
  slant_range_km:          1000
  elevation_deg:           30
  cross_section_m2:        1.0
  angular_velocity_deg_s:  0.5
